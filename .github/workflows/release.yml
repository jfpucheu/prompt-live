name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: self-hosted
            arch: intel
            python: python3.12
          - os: macos-14
            arch: apple-silicon
            python: python3

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (GitHub-hosted only)
        if: matrix.arch == 'apple-silicon'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          ${{ matrix.python }} -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Build app
        run: .venv/bin/pyinstaller prompt-live.spec --clean --noconfirm

      - name: Zip app
        run: |
          cd dist
          zip -r "../Prompt-Live-${{ matrix.arch }}.zip" Prompt-Live.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Live-${{ matrix.arch }}
          path: Prompt-Live-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Prompt-Live ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Prompt-Live-intel/Prompt-Live-intel.zip
            Prompt-Live-apple-silicon/Prompt-Live-apple-silicon.zip
